services:
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.auth-service
    env_file: .env
    ports:
      - "8001:8000"
    volumes:
      - ${HOME}/.aws:/root/.aws:ro

  core-api:
    build:
      context: .
      dockerfile: Dockerfile.core-api
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ${HOME}/.aws:/root/.aws:ro

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    volumes:
      - ${HOME}/.aws:/root/.aws:ro

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: studymate
      POSTGRES_PASSWORD: studymate
      POSTGRES_DB: studymate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_data: