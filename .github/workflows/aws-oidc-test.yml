name: AWS OIDC test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::458586357596:role/studymate-github-actions-deploy
          aws-region: us-west-2

      - run: aws sts get-caller-identity
