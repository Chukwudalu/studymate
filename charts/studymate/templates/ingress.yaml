apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: studymate
  namespace: studymate
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/security-groups: {{ .Values.albSecurityGroupId }}
    # Both services only expose /healthz as an unauthenticated route - the
    # ALB's default health check path ("/") isn't a real route on either
    # app, which is why target groups came up unhealthy on first deploy.
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    {{- if .Values.acmCertificateArn }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.acmCertificateArn }}
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    {{- else }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    {{- end }}
spec:
  rules:
    - http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: core-api
                port:
                  number: 80
