apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: studymate
spec:
  # KEDA's ScaledObject (scaledobject.yaml) owns this field at runtime -
  # this initial value only matters before KEDA's first reconcile.
  replicas: 0
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      serviceAccountName: worker
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          envFrom:
            - secretRef:
                name: studymate-secrets
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          # No HTTP server in this process (it's an SQS poll loop) - no probes.
