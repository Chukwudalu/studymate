apiVersion: v1
kind: ServiceAccount
metadata:
  name: core-api
  namespace: studymate
  annotations:
    # IRSA: lets this pod assume the S3/SQS-scoped role without static AWS
    # keys. Trust policy in terraform/eks_irsa.tf is keyed to this exact
    # ServiceAccount name+namespace - do not rename without updating that.
    eks.amazonaws.com/role-arn: {{ .Values.irsaRoleArn }}
